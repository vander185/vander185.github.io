<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0a16">
<link rel="preconnect" href="https://api.elevenlabs.io" crossorigin>
<link rel="preconnect" href="https://livekit.rtc.elevenlabs.io" crossorigin>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob: data:; connect-src 'self' https://api.open-meteo.com https://geocoding-api.open-meteo.com https://fr.wikipedia.org https://*.elevenlabs.io wss://*.elevenlabs.io https://*.livekit.cloud wss://*.livekit.cloud; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self'">
<title>Claire</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0c0a16;--card:#ffffff0b;--card2:#ffffff12;--line:#ffffff14;--txt:#f6f3fb;--mut:#a09bb4;--dim:#6f6a85;--p:#ff8fb3;--v:#9f86ff;--o:#ffc78f;--grad:linear-gradient(120deg,var(--p),var(--v) 55%,var(--o))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:16px/1.45 -apple-system,"SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow:hidden}
/* aurore en fond */
.aur{position:fixed;inset:-20% -20% auto;height:75vh;z-index:-1;filter:blur(60px);opacity:.55;pointer-events:none}
.aur i{position:absolute;border-radius:50%;animation:drift 18s ease-in-out infinite alternate}
.aur i:nth-child(1){width:55vw;height:55vw;left:5%;top:18%;background:#ff8fb355}
.aur i:nth-child(2){width:60vw;height:60vw;right:0;top:5%;background:#9f86ff66;animation-duration:22s}
.aur i:nth-child(3){width:40vw;height:40vw;left:35%;top:40%;background:#ffc78f33;animation-duration:26s}
@keyframes drift{to{transform:translate(6vw,4vh) scale(1.12)}}
body[data-state=speaking] .aur{opacity:.8}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;letter-spacing:-.01em}
.brand .lg{width:34px;height:34px;filter:drop-shadow(0 4px 10px #9f86ff55)}
.hr{display:flex;align-items:center;gap:8px}
#key{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid #ff8fb388;color:var(--txt);font-size:16px;cursor:pointer;position:relative;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
#key:not(.ok):after{content:'';position:absolute;top:2px;right:2px;width:9px;height:9px;border-radius:50%;background:var(--p)}
#key.ok{border-color:var(--line);opacity:.75}
#keybox{position:fixed;inset:0;z-index:20;background:#05040bcc;display:flex;align-items:center;justify-content:center;padding:20px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#keybox[hidden]{display:none}
.kcard{width:100%;max-width:400px;background:#171325;border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px #000a}
.kcard h3{margin:0;font-size:18px}.kcard p{margin:0;color:#cbc5dc;font-size:14px}
.kcard input{background:#0c0a14;border:1px solid #ffffff22;color:#fff;border-radius:14px;padding:14px;font:600 20px/1 ui-monospace,monospace;letter-spacing:.12em;text-align:center;text-transform:uppercase;outline:none}
.kcard input:focus{border-color:#9f86ff}
.kb{display:flex;gap:8px}.kb button{flex:1;border:0;border-radius:14px;padding:13px;font:700 15px/1 inherit;background:var(--grad);color:#1c0f2e;cursor:pointer}.kb .kn{background:#ffffff12;color:var(--txt)}
#wake{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 8px 6px 12px;color:var(--txt);font:inherit;cursor:pointer;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
#wake b{display:flex;flex-direction:column;align-items:flex-start;font-size:12.5px;font-weight:600;line-height:1.15}
#wake small{font-size:10.5px;font-weight:500;color:var(--mut)}
#wake i{order:2;width:36px;height:22px;border-radius:99px;background:#2c2840;position:relative;transition:.25s;flex:none}
#wake i:after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#bdb8cc;transition:.25s}
#wake.on i{background:var(--grad)}
#wake.on i:after{left:17px;background:#fff}
.hello{padding:18px 22px 0}
.hello h2{margin:0;font-size:27px;font-weight:700;letter-spacing:-.02em}
.hello h2 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hello p{margin:3px 0 0;color:var(--mut);font-size:14.5px}
.stage{display:flex;flex-direction:column;align-items:center;padding:14px 20px 4px}
/* la perle de Claire */
#orb{width:200px;height:200px;border-radius:50%;border:0;padding:0;cursor:pointer;position:relative;background:none;outline:none}
#orb .halo{position:absolute;inset:-14px;border-radius:50%;background:conic-gradient(from 0deg,var(--p),var(--v),var(--o),var(--p));filter:blur(26px);opacity:.45;animation:spin 12s linear infinite}
#orb .core{position:absolute;inset:14px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#ffffff70,transparent 45%),linear-gradient(140deg,var(--p),var(--v) 55%,var(--o));box-shadow:inset 0 -18px 40px #3b1f6e55,0 20px 50px #9f86ff44;transition:transform .2s}
#orb .ring{position:absolute;inset:6px;border-radius:50%;border:2px solid #ffffff55;opacity:0}
#orb .bars{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:7px}
#orb .bars i{width:9px;height:18px;border-radius:9px;background:#fff;box-shadow:0 3px 10px #3b1f6e44;transition:height .08s}
#orb:active .core{transform:scale(.97)}
body[data-state=idle] #orb .core,body[data-state=wake] #orb .core{animation:breathe 4.5s ease-in-out infinite}
body[data-state=listening] #orb .ring{animation:ring 1.6s ease-out infinite}
body[data-state=connecting] #orb .halo{animation:spin 1.2s linear infinite;opacity:.7}
body[data-state=speaking] #orb .halo{opacity:.75}
@keyframes spin{to{rotate:360deg}}
@keyframes breathe{50%{transform:scale(1.03)}}
@keyframes ring{0%{opacity:.9;scale:.92}100%{opacity:0;scale:1.22}}
#status{margin-top:14px;font-size:14.5px;color:#d7d1ea;min-height:21px;text-align:center}
#log{width:100%;max-width:520px;max-height:20vh;overflow-y:auto;margin-top:8px;display:flex;flex-direction:column;gap:6px;padding:0 4px;-webkit-mask-image:linear-gradient(transparent,#000 16px);mask-image:linear-gradient(transparent,#000 16px)}
#log:empty{display:none}
.msg{max-width:84%;padding:8px 13px;border-radius:18px;font-size:14.5px;line-height:1.4}
.msg.user{align-self:flex-end;background:var(--grad);color:#1c0f2e;border-bottom-right-radius:6px}
.msg.agent{align-self:flex-start;background:var(--card2);border:1px solid var(--line);border-bottom-left-radius:6px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
/* raccourcis */
#chips{display:flex;gap:8px;overflow-x:auto;padding:12px 18px 4px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
#chips button{flex:none;display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:99px;padding:9px 14px;font:600 13.5px/1 inherit;cursor:pointer;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
#chips button:active{background:var(--card2)}
/* panneau du bas */
.panel{flex:1;min-height:0;display:flex;flex-direction:column;background:linear-gradient(#16131f,#110f19);border-top:1px solid var(--line);border-radius:28px 28px 0 0;margin-top:10px;box-shadow:0 -12px 40px #0006}
.grab{width:38px;height:4px;border-radius:9px;background:#ffffff22;margin:8px auto 0}
.tabs{display:flex;gap:4px;margin:10px 14px 6px;background:#0c0a14;border-radius:14px;padding:4px}
.tabs button{flex:1;background:none;border:0;color:var(--mut);font:600 13.5px/1 inherit;padding:10px 0;border-radius:11px;cursor:pointer;position:relative}
.tabs button.on{background:#262038;color:#fff;box-shadow:0 2px 10px #0005}
#nr:not(:empty){display:inline-block;margin-left:5px;background:var(--p);color:#2a0b17;border-radius:99px;font-size:10.5px;padding:2px 6px;vertical-align:1px}
#list{flex:1;overflow-y:auto;padding:6px 14px 20px;display:flex;flex-direction:column;gap:8px}
.it{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px 42px 11px 15px}
.it b{display:block;font-size:15px;font-weight:650}
.it p{margin:4px 0 0;color:#cbc5dc;font-size:14px;white-space:pre-line}
.it em{display:block;margin-top:6px;font-style:normal;font-size:12px;color:var(--dim)}
.it.done{opacity:.5}
.x{position:absolute;top:9px;right:9px;width:28px;height:28px;border-radius:50%;border:0;background:#ffffff0d;color:var(--mut);font-size:17px;line-height:1;cursor:pointer}
.empty{color:var(--dim);text-align:center;font-size:14px;margin:26px 22px;line-height:1.5}
#cf{display:flex;gap:6px}
#cf input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:13px;padding:11px 12px;font:inherit;font-size:14px;outline:none}
#cf input:focus{border-color:#9f86ff88}
#cf button{background:var(--grad);border:0;border-radius:13px;color:#1c0f2e;font-weight:700;padding:0 15px}
.vx{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.vx h3{margin:0;font-size:16px}.vx p{margin:0;color:#cbc5dc;font-size:14px}
.vx .big{background:var(--grad);border:0;border-radius:14px;color:#1c0f2e;font:700 15px/1 inherit;padding:14px}
.vx .sec{background:#ffffff0f;border:0;border-radius:12px;color:var(--txt);font:600 14px/1 inherit;padding:12px}
.seg{display:flex;background:#0c0a14;border-radius:12px;padding:3px}.seg button{flex:1;border:0;background:none;color:var(--mut);font:600 14px/1 inherit;padding:10px;border-radius:10px}.seg button.on{background:#262038;color:#fff}
.dots{display:flex;gap:8px;justify-content:center}.dots i{width:14px;height:14px;border-radius:50%;background:#2a2638}.dots i.on{background:var(--grad)}
body.locked .panel,body.locked #chips{visibility:hidden}
body.locked .stage:after{content:'🔒 Téléphone verrouillé : tes notes restent cachées';display:block;margin-top:16px;font-size:12.5px;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));translate:-50% 20px;background:#2a2440ee;color:#fff;padding:11px 17px;border-radius:16px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px #0008;max-width:88vw;text-align:center;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#toast.show{opacity:1;translate:-50% 0}
@media (max-height:700px){#orb{width:160px;height:160px}.hello{padding-top:10px}.hello h2{font-size:23px}}
</style>
</head>

<div class="aur"><i></i><i></i><i></i></div>

Claire</div>

<script src="claire.js"></script>

</html>
