<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b12">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob: data:; connect-src 'self' https://api.open-meteo.com https://geocoding-api.open-meteo.com https://fr.wikipedia.org https://*.elevenlabs.io wss://*.elevenlabs.io https://*.livekit.cloud wss://*.livekit.cloud; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self'">
<title>Claire</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0b0b12;--card:#15151f;--line:#ffffff12;--txt:#f4f2f7;--mut:#8d8a9b;--a1:#ff8fb1;--a2:#a78bfa;--a3:#ffd29d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:16px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:radial-gradient(120% 60% at 50% 0%,#1b1530 0%,var(--bg) 60%) fixed}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 0}
header h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}
header h1 span{background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
#wake{display:flex;flex-direction:column;align-items:flex-end;background:none;border:0;color:var(--txt);font:inherit;cursor:pointer;padding:6px 0}
#wake b{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
#wake b i{width:34px;height:20px;border-radius:99px;background:#2a2838;position:relative;transition:.25s}
#wake b i:after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#bbb;transition:.25s}
#wake.on b i{background:linear-gradient(90deg,var(--a1),var(--a2))}
#wake.on b i:after{left:16px;background:#fff}
#wake small{font-size:11px;color:var(--mut)}
.stage{display:flex;flex-direction:column;align-items:center;padding:18px 20px 6px}
#orb{width:190px;height:190px;border-radius:50%;border:0;cursor:pointer;position:relative;background:none;padding:0}
#orb .core{position:absolute;inset:18px;border-radius:50%;background:conic-gradient(from 210deg,var(--a1),var(--a2),var(--a3),var(--a1));filter:blur(.5px);box-shadow:0 0 60px #a78bfa55,inset 0 0 40px #ffffff30;animation:spin 14s linear infinite,breathe 4.5s ease-in-out infinite}
#orb .glass{position:absolute;inset:18px;border-radius:50%;background:radial-gradient(60% 60% at 35% 30%,#ffffff55,transparent 60%),radial-gradient(80% 80% at 50% 60%,transparent 50%,#0b0b1288)}
#orb .ring{position:absolute;inset:0;border-radius:50%;border:2px solid #a78bfa44;opacity:0}
#orb svg{position:absolute;inset:0;margin:auto;width:46px;height:46px;fill:#fff;opacity:.92;filter:drop-shadow(0 2px 6px #0006)}
body[data-state=listening] #orb .ring{animation:ring 1.6s ease-out infinite}
body[data-state=listening] #orb .core{animation:spin 6s linear infinite,breathe 1.6s ease-in-out infinite}
body[data-state=speaking] #orb .core{animation:spin 3s linear infinite,talk .5s ease-in-out infinite alternate}
body[data-state=connecting] #orb .core{animation:spin 1.2s linear infinite;opacity:.7}
body[data-state=wake] #orb .core{animation:spin 20s linear infinite,breathe 6s ease-in-out infinite;opacity:.75}
body:is([data-state=listening],[data-state=speaking]) #orb svg.mic{display:none}
body:not(:is([data-state=listening],[data-state=speaking])) #orb svg.stop{display:none}
@keyframes spin{to{rotate:360deg}}
@keyframes breathe{50%{scale:1.04}}
@keyframes talk{from{scale:.97}to{scale:1.09}}
@keyframes ring{0%{opacity:.9;scale:.9}100%{opacity:0;scale:1.25}}
#status{margin-top:14px;font-size:15px;color:#cfcbe0;min-height:22px;text-align:center}
#log{width:100%;max-width:520px;max-height:22vh;overflow-y:auto;margin-top:10px;display:flex;flex-direction:column;gap:6px;padding:0 4px;mask-image:linear-gradient(transparent,#000 18px)}
.msg{max-width:85%;padding:8px 12px;border-radius:16px;font-size:14.5px}
.msg.user{align-self:flex-end;background:#2b2442;border-bottom-right-radius:5px}
.msg.agent{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.panel{flex:1;min-height:0;display:flex;flex-direction:column;background:#11111a;border-top:1px solid var(--line);border-radius:24px 24px 0 0;margin-top:8px}
.tabs{display:flex;gap:6px;padding:12px 14px 6px}
.tabs button{flex:1;background:none;border:0;color:var(--mut);font:600 14px/1 inherit;padding:10px 0;border-radius:12px;cursor:pointer;position:relative}
.tabs button.on{background:#1d1b2b;color:var(--txt)}
#nr:not(:empty){display:inline-block;margin-left:6px;background:var(--a1);color:#1a0b12;border-radius:99px;font-size:11px;padding:2px 6px;vertical-align:1px}
#list{flex:1;overflow-y:auto;padding:4px 14px 18px;display:flex;flex-direction:column;gap:8px}
.it{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 40px 10px 14px}
.it b{display:block;font-size:15px}
.it p{margin:4px 0 0;color:#c9c5d6;font-size:14px;white-space:pre-line}
.it em{display:block;margin-top:6px;font-style:normal;font-size:12px;color:var(--mut)}
.it.done{opacity:.5}
.x{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;border:0;background:#ffffff0d;color:var(--mut);font-size:18px;line-height:1;cursor:pointer}
.empty{color:var(--mut);text-align:center;font-size:14px;margin:26px 20px}
#cf{display:flex;gap:6px}
#cf input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:10px 12px;font:inherit;font-size:14px}
#cf button{background:linear-gradient(90deg,var(--a1),var(--a2));border:0;border-radius:12px;color:#140b1c;font-weight:700;padding:0 14px}
body.locked .panel{visibility:hidden}
body.locked .stage:after{content:'🔒 Téléphone verrouillé : tes notes restent cachées';display:block;margin-top:16px;font-size:12.5px;color:var(--mut)}
.vx{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.vx h3{margin:0;font-size:16px}.vx p{margin:0;color:#c9c5d6;font-size:14px}
.vx .big{background:linear-gradient(90deg,var(--a1),var(--a2));border:0;border-radius:14px;color:#140b1c;font:700 15px/1 inherit;padding:14px}
.vx .sec{background:#ffffff0f;border:0;border-radius:12px;color:var(--txt);font:600 14px/1 inherit;padding:12px}
.seg{display:flex;background:#0f0f18;border-radius:12px;padding:3px}.seg button{flex:1;border:0;background:none;color:var(--mut);font:600 14px/1 inherit;padding:10px;border-radius:10px}.seg button.on{background:#2b2442;color:#fff}
.dots{display:flex;gap:8px;justify-content:center}.dots i{width:14px;height:14px;border-radius:50%;background:#2a2838}.dots i.on{background:linear-gradient(135deg,var(--a1),var(--a2))}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));translate:-50% 20px;background:#26233a;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 8px 30px #0008;max-width:88vw;text-align:center}
#toast.show{opacity:1;translate:-50% 0}
</style>
</head>
<body data-state="idle">
<header>
  <h1><span>Claire</span></h1>
  <button id="wake" type="button"><b>Réveil vocal <i></i></b><small></small></button>
</header>
<div class="stage">
  <button id="orb" type="button" aria-label="Parler à Claire">
    <span class="ring"></span><span class="core"></span><span class="glass"></span>
    <svg class="mic" viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    <svg class="stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2.5"/></svg>
  </button>
  <div id="status"></div>
  <div id="log"></div>
</div>
<section class="panel">
  <nav class="tabs"><button data-t="notes" class="on">Notes</button><button data-t="rappels">Rappels<span id="nr"></span></button><button data-t="contacts">Contacts</button><button data-t="voix" id="tvoix" hidden>Ma voix</button></nav>
  <div id="list"></div>
</section>
<div id="toast"></div>
<script src="claire.js"></script>
</body>
</html>
